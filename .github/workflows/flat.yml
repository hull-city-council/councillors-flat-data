name: Councillors

on:
  push:
    paths:
      - ".github/workflows/flat.yml"
      - "postprocess.js"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v2.x

      - name: Fetch and process councillor data
        uses: githubocto/flat@v3
        with:
          http_url: ${{ secrets.APIFY_ENDPOINT }}
          mask: true
          downloaded_filename: councillors.json
          postprocess: postprocess.js