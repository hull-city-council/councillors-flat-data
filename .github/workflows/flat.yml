name: Councillors

on:
  push:
    paths:
      - ".github/workflows/flat.yml"
      - "postprocess.js"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v2.x

      - name: Fetch councillor data
        run: curl -fsSL "${{ secrets.APIFY_ENDPOINT }}" -o councillors.json


      - name: Download councillor images
        run: >
          deno run
          --allow-read
          --allow-write
          --allow-net=cmis.hullcc.gov.uk
          --unsafely-ignore-certificate-errors=cmis.hullcc.gov.uk
          postprocess.js

      - name: Commit downloaded images and updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.fileMode false

          git add councillors.json images/

          if git diff --staged --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Update councillor images"
          git pull --rebase origin "${{ github.ref_name }}"
          git push